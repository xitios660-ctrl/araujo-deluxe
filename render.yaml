services:
  - type: web
    name: araujo-deluxe
    runtime: python
    plan: free
    rootDir: .
    buildCommand: bash backend/build-frontend.sh
    startCommand: uvicorn frontend_server:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: NODE_VERSION
        value: "22.16.0"
      - key: BACKEND_ORIGIN
        value: https://dente-de-cobra-api.onrender.com
