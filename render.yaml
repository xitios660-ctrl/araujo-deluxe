services:
  - type: web
    name: dente-de-cobra-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false          # connection string do MongoDB Atlas (ja configurada)
      - key: DB_NAME
        value: araujo_deluxe
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: texeirakelvin74@gmail.com
      - key: ADMIN_PASSWORD
        sync: false          # senha do painel /admin (ja configurada como gugu123)
      - key: CORS_ORIGINS
        value: https://xitios660-ctrl.github.io
      - key: PIX_KEY
        value: texeirakelvin74@gmail.com
      - key: WHATSAPP_NUMBER
        value: "5511999999999"
      - key: OWNER_WHATSAPP
        value: "5511999999999"
      - key: WHATSAPP_BOT_URL
        value: http://localhost:3002
